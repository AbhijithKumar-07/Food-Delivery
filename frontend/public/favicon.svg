<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A36"/>
      <stop offset="100%" stop-color="#E22E1A"/>
    </linearGradient>
  </defs>

  <!-- Premium Smooth Squircle Tile -->
  <rect width="64" height="64" rx="16" fill="url(#brandGradient)"/>

  <!-- Iconic 'T.' Brandmark -->
  <g fill="#FFFFFF">
    <!-- Horizontal Crossbar of T -->
    <rect x="14" y="16" width="28" height="6" rx="3"/>
    <!-- Vertical Stem of T -->
    <rect x="25" y="16" width="6" height="32" rx="3"/>
    <!-- Signature 'Tomato.' Dot -->
    <circle cx="46" cy="45" r="4.5"/>
  </g>
</svg>
