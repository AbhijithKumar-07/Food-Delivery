<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tomatoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6347"/>
      <stop offset="100%" stop-color="#E23E1D"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#E23E1D" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Tomato Main Body with Shadow -->
  <g filter="url(#softGlow)">
    <ellipse cx="32" cy="37" rx="24" ry="22" fill="url(#tomatoBg)"/>
  </g>

  <!-- Specular Highlight for depth -->
  <path d="M 18 24 A 18 16 0 0 1 36 18" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Tomato Stem -->
  <path d="M 32 16 C 31 10 33 6 36 4" stroke="#15803D" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- Calyx Leaves -->
  <!-- Left Leaf -->
  <path d="M 32 16 C 26 12 18 13 16 16 C 20 18 27 18 32 16 Z" fill="url(#leafGrad)"/>
  <!-- Right Leaf -->
  <path d="M 32 16 C 38 12 46 13 48 16 C 44 18 37 18 32 16 Z" fill="url(#leafGrad)"/>
  <!-- Center/Bottom Small Leaf -->
  <path d="M 32 16 C 30 19 31 22 32 23 C 33 22 34 19 32 16 Z" fill="url(#leafGrad)"/>
</svg>
